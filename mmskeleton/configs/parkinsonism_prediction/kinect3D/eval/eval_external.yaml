argparse_cfg:
  gpus:
    bind_to: processor_cfg.gpus
    help: number of gpus
  work_dir:
    bind_to: processor_cfg.work_dir
    help: the dir to save logs and models
  batch_size:
    bind_to: processor_cfg.batch_size
  resume_from:
    bind_to: processor_cfg.resume_from
    help: the checkpoint file to resume from

processor_cfg:
  type: 'processor.parkinsonism_prediction_kinect_eval.eval'
  workers: 1
  cv: 1 # how many cv folds did you train during the training step. These pretrained models already need to exist
  notes: "two_part_loss"
  group_notes: "eval_all_participants_TO_SHARE_JULY31_dev"
  wandb_project: "RELEASE_DEV_eval_ALL_TO_SHARE_FINAL_JUL31"
  freeze_encoder: False
  head: "stgcn"
  model_save_root: "kinect3d_models_july31_to_share"  # This is where we look for and save pretrained models
  resource_root: "/home/saboa/data/shared_from_cluster"
  compute_stats: True # need to have at least a subset of labelled data to enable this

  # model setting
  model_cfg:
    type: 'models.backbones.ST_GCN.ST_GCN_18_ordinal_smaller_2_position_pretrain'
    in_channels: 3
    num_class: 3                                # What is the range of UPDRS-gait scores available (num_class = 3 indicates 0->2 inclusive)
    edge_importance_weighting: True
    dropout: 0.1
    num_ts_predicting: 1
    num_joints_predicting: 4
    temporal_kernel_size: 13
    graph_cfg:
      layout: 'kinect_coco_simplified_head'
      strategy: 'spatial'
  loss_cfg:
    - {type: 'torch.nn.MSELoss'} # This is for finetuning
    

  # dataset setting
  dataset_cfg:
    # data to evaluate on
    - type: "datasets.DataPipeline"
      data_source:
        type: "datasets.SkeletonLoaderKinect"
        data_dir: May2023_with_clinical/pd_previous_subset
        use_gait_feats: False
        num_track: 1
        num_keypoints: 13
        repeat: 1
        outcome_label: UPDRS_gait
        csv_loader: True
        missing_joint_val: mean
        cache: True
        flip_skels: True
        extrema_range: 2        # What is the highest score in this dataset


      pipeline:
        - {type: "datasets.skeleton.kinect3D_centre_hip", centre: [0, 0, 0]}
        - {type: "datasets.skeleton.normalize_by_resolution"}
        - {type: "datasets.skeleton.mask_by_visibility"}
        - {type: "datasets.skeleton.pad_zero_beginning", size: 120 }
        - {type: "datasets.skeleton.crop_middle", size: 120 }
        - {type: "datasets.skeleton.transpose", order: [0, 2, 1, 3]}
        - {type: "datasets.skeleton.to_tuple"}

  # dataloader setting
  batch_size: 100
  gpus: 1

  # optimizer setting
  optimizer_cfg:
    # Fine tuning
    - {type: 'torch.optim.SGD',
    lr: 0.001,
    momentum: 0.9,
    nesterov: true,
    weight_decay: 0.0000}

  # runtime setting
  workflow: [['test', 1]]
  work_dir: ./work_dir/parkinsonism_prediction/  # Where should the results be saved?
  total_epochs: 1000
  training_hooks:
  training_hooks:
    lr_config:
      policy: 'cyclic'
      cyclic_times: 50
      step_ratio_up: 0.2
      target_ratio: !!python/tuple [10, 0.00001]
    log_config:
      interval: 1000
      hooks:
        - type: WandbLoggerHook
    checkpoint_config:
      interval: 200
    optimizer_config:
      grad_clip:
  resume_from:
  load_from:
